global:
  scrape_interval: 15s
scrape_configs:
  - job_name: core-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["core-service:18081"] }]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["notification-service:18082"] }]
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["api-gateway:18089"] }]
