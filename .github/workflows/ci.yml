name: CI
on:
  pull_request:
  push:
    branches: [main, "feature/**", "fix/**"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: connectone_test
          POSTGRES_USER: connectone_app
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5434:5432"] # the test profile targets localhost:5434/connectone_test
        options: >-
          --health-cmd "pg_isready -U connectone_app -d connectone_test"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    env:
      CONNECTONE_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Create the notification-service test database
        run: PGPASSWORD=ci-only-password psql -h localhost -p 5434 -U connectone_app -d postgres -c 'CREATE DATABASE connectone_notifications_test'
      - run: ./mvnw -B verify   # builds and tests core-service, notification-service (embedded Kafka) and api-gateway
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: core-service, context: ., port: "18081" }
          - { service: notification-service, context: ., port: "18082" }
          - { service: api-gateway, context: ., port: "18080" }
          - { service: frontend, context: frontend, port: "80" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
