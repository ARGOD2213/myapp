# PostgreSQL integration-test profile. Uses the dedicated connectone_test database inside the ConnectOne
# PostgreSQL container (port 5434). The schema is wiped and re-migrated at test start (see TestDatabaseConfiguration);
# that code refuses to run against anything except connectone_test.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/connectone_test
    username: connectone_app
    password: ${CONNECTONE_DB_PASSWORD}
  flyway:
    clean-disabled: false

connectone:
  outbox:
    relay:
      enabled: false   # tests assert on the outbox table; OutboxRelayTests drives the relay explicitly
  jwt:
    secret: test-only-connectone-jwt-signing-secret-32-bytes-minimum
  otp:
    expose-code: true
  seed:
    enabled: true
    password: test-only-seed-password
